services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pelumas
      POSTGRES_PASSWORD: pelumas
      POSTGRES_DB: pelumas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelumas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
